name: Windows

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-amd64

jobs:
  amd64:
    name: Windows amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $qtRoot = "C:\Qt\6.12.0\msvc2022_64"
          New-Item -ItemType Directory -Force -Path $qtRoot | Out-Null
          $repo = "https://download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_6120/qt6_6120_msvc2022_64"
          $stamp = "6.12.0-0-202609280346"
          $basePkg = "qt.qt6.6120.win64_msvc2022_64"
          $archives = @(
            "$basePkg/${stamp}qtbase-Windows-Windows_11_24H2-MSVC2022-Windows-Windows_11_24H2-X86_64.7z",
            "$basePkg/${stamp}qtsvg-Windows-Windows_11_24H2-MSVC2022-Windows-Windows_11_24H2-X86_64.7z",
            "$basePkg/${stamp}qttools-Windows-Windows_11_24H2-MSVC2022-Windows-Windows_11_24H2-X86_64.7z",
            "$basePkg/${stamp}qtdeclarative-Windows-Windows_11_24H2-MSVC2022-Windows-Windows_11_24H2-X86_64.7z",
            "$basePkg/${stamp}d3dcompiler_47-x64.7z",
            "qt.qt6.6120.addons.qtmultimedia.win64_msvc2022_64/${stamp}qtmultimedia-Windows-Windows_11_24H2-MSVC2022-Windows-Windows_11_24H2-X86_64.7z",
            "qt.qt6.6120.addons.qtshadertools.win64_msvc2022_64/${stamp}qtshadertools-Windows-Windows_11_24H2-MSVC2022-Windows-Windows_11_24H2-X86_64.7z"
          )
          $seven = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $seven)) {
            $cmd = Get-Command 7z -ErrorAction SilentlyContinue
            if (-not $cmd) { throw "7z was not found" }
            $seven = $cmd.Source
          }
          foreach ($archive in $archives) {
            $name = Split-Path $archive -Leaf
            $out = Join-Path $env:RUNNER_TEMP $name
            Write-Host "Downloading $name"
            curl.exe -L --fail --retry 5 --retry-all-errors -o $out "$repo/$archive"
            & $seven x $out "-o$qtRoot" -y
            if ($LASTEXITCODE -ne 0) { throw "Could not extract $name" }
            Remove-Item $out
          }
          if (-not (Test-Path "$qtRoot\bin\windeployqt.exe")) { throw "windeployqt was not installed" }
          "QT_ROOT=$qtRoot" >> $env:GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT"
          cmake --build build --parallel
          $env:PATH = "$env:QT_ROOT\bin;" + $env:PATH
          ctest --test-dir build --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path (Get-Location) "dist\MovPress"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item build\MovPress.exe $dist
          & "$env:QT_ROOT\bin\windeployqt.exe" --release --compiler-runtime --no-translations "$dist\MovPress.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          curl.exe -L --fail -o $zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "ffmpeg"
          Expand-Archive -Path $zip -DestinationPath $expanded -Force
          $ffmpeg = Get-ChildItem $expanded -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe was not in the archive" }
          Copy-Item $ffmpeg.FullName $dist
          Copy-Item (Join-Path $ffmpeg.DirectoryName "ffprobe.exe") $dist
          foreach ($name in @("MovPress.exe", "ffmpeg.exe", "ffprobe.exe", "platforms\qwindows.dll")) {
            if (-not (Test-Path (Join-Path $dist $name))) { throw "Missing $name" }
          }
          $headers = dumpbin /nologo /headers (Join-Path $dist "MovPress.exe") | Out-String
          if ($headers -notmatch "8664 machine \(x64\)") { throw "MovPress.exe is not amd64" }
          $ff = dumpbin /nologo /headers (Join-Path $dist "ffmpeg.exe") | Out-String
          if ($ff -notmatch "8664 machine \(x64\)") { throw "ffmpeg.exe is not amd64" }
          & (Join-Path $dist "ffmpeg.exe") -version
          if ($LASTEXITCODE -ne 0) { throw "bundled ffmpeg did not start" }
          & (Join-Path $dist "ffprobe.exe") -version
          if ($LASTEXITCODE -ne 0) { throw "bundled ffprobe did not start" }
          Compress-Archive -Path $dist -DestinationPath "MovPress-windows-amd64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MovPress-windows-amd64
          path: MovPress-windows-amd64.zip
          if-no-files-found: error
